name: Build LAN Chat APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6 cmake \
            libffi-dev libssl-dev automake autopoint gettext

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install git+https://github.com/kivy/buildozer
          pip install legacy-cgi setuptools cython==0.29.34

      - name: Build Android APK
        env:
          PYTHONUNBUFFERED: "1"
          APP_ANDROID_ACCEPT_SDK_LICENSE: "1"
          BUILDOZER_WARN_ON_ROOT: "0"
        run: |
          buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lanchat-apk
          path: bin/*.apk
